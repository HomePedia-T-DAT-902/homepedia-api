name: Tests

on:
  workflow_call:

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-test-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-test-

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --no-root --only main,dev

      - name: Run tests with coverage
        run: poetry run pytest tests/ -v --tb=short --cov=src --cov-report=term-missing
