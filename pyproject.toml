[tool.poetry]
name = "homepedia-api"
version = "0.1.0"
description = "Plateforme d'analyse du marché immobilier français"
authors = ["Homepedia Team"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"

# API
fastapi = "^0.115"
uvicorn = {extras = ["standard"], version = "^0.34"}
pydantic = "^2.0"
python-dotenv = "^1.0"

# Database
sqlalchemy = "^2.0"
psycopg2-binary = "^2.9"
geoalchemy2 = "^0.15"
asyncpg = "^0.30"

[tool.poetry.group.bigdata]
optional = true

[tool.poetry.group.bigdata.dependencies]
pyspark = "^3.5"
pandas = "^2.2"
pyarrow = "^18.0"
geopandas = "^1.0"
openpyxl = "^3.1"

[tool.poetry.group.scraping]
optional = true

[tool.poetry.group.scraping.dependencies]
scrapy = "^2.11"
beautifulsoup4 = "^4.12"
requests = "^2.32"

[tool.poetry.group.utils]
optional = true

[tool.poetry.group.utils.dependencies]
wordcloud = "^1.9"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
httpx = "^0.28"
ruff = "^0.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
